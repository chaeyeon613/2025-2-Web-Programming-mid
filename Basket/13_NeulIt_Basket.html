<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수강바구니</title>
  <link rel="stylesheet" href="13_NeulIt_Basket.css">
  <link rel="stylesheet" href="../13_NeulIt_style.css">
</head>



<body>
  <!-- nav -->
  <header>
    <header>
      <nav class="nav-container">
        <a href="../Lecture/13_NeulIt_LectureMain.html"><img src="../Images/main_logoicon.png" alt="로고" class="logo"></a>
        <div class="menu">
          <input type="radio" id="lecture" name="nav" value="lecture">
          <label for="lecture"><a href="../Lecture/13_NeulIt_LectureMain.html">강의</a></label>
  
          <input type="radio" id="mentoring" name="nav" value="mentoring">
          <label for="mentoring"><a href="../Mentoring/13_NeulIt_MentoringMain.html">멘토링</a></label>
  
          <input type="radio" id="community" name="nav" value="community">
          <label for="community"><a href="../Community/13_NeulIt_CommunityMain.html">커뮤니티</a></label>
  
          <input type="radio" id="clip" name="nav" value="clip">
          <label for="clip"><a href="../Clip/13_NeulIt_ClipMain.html">클립</a></label>
        </div>
        <div>
          <a href="13_NeulIt_Basket.html"><img src="../Images/cart.svg" alt="장바구니" class="icon"></a>
          <a href="../Profile/13_NeulIt_ProfileDash.html"><img src="../Images/profile.svg" alt="마이페이지" class="icon"></a>          
        </div>
      </nav>
    </header>
  

  <!-- 메인 -->
  <main class="container">
    <h1 class="title">수강바구니</h1>

    <!-- 전체선택 / 선택삭제 -->
    <section class="cart-top">
      <div class="select-left">
        <input type="checkbox" id="selectAll">
        <label for="selectAll">전체선택 <span class="highlight">0 / 3</span></label>
      </div>
      <button class="delete-selected">선택삭제</button>
    </section>

    <!-- 강의 항목 -->
    <div id="cart-list"></div>

    <hr class="cart-divider">

    <!-- 예상 결제금액 영역 -->
    <section class="payment-summary">
      <h2>예상 결제금액</h2>

      <div class="summary-item">
        <span>총 상품금액</span><strong class="sum-product">₩0</strong>
      </div>
      <div class="summary-item">
        <span>상품 할인</span><strong class="sum-discount">₩0</strong>
      </div>
      
      <div class="summary-item coupon">
        <span>쿠폰할인</span>
        <select class="coupon-select">
          <option value="0">쿠폰 선택</option>
          <option value="5000">프로모션 5,000원 할인</option>
          <option value="10000">프로모션 10,000원 할인</option>
        </select>
      </div>
      
      <hr class="divider">

      <div class="summary-item total">
        <span class="sum-count">총 0개 주문금액</span>
        <strong class="sum-total">₩0</strong>
      </div>
    </section>
  </main>

  <!-- 결제바 -->
  <section class="checkout-wrap">
    <div class="checkout-bar">
      <p class="checkout-text">
        회원 본인은 주문내역을 확인했으며, <span>구매조건</span> 및 
        <span>개인정보처리방침</span>과 결제에 동의합니다.
      </p>
      <button class="pay-btn">₩0 결제하기</button>
    </div>
  </section>


  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-top">
        <img src="../Images/footer_logo.png" alt="Inflearn 로고" class="footer-logo">
      </div>
      <div class="footer-info">
        <p>(주)늘잇 | 숙명여자대학교 2025학년도 2학기 웹프로그래밍 13팀 중간과제</p>
        <p>2415028 김수빈 | 2413954 김영채 | 2414801 김하영 | 2411041 이채연 | 2110359 여수민</p>
        <p>© NEULIT. ALL RIGHTS RESERVED</p>
      </div>
    </div>
  </footer>

  <script src="../Lecture/13_NeulIt_Courses.js"></script>
  <script src="13_NeulIt_Basket.js"></script>

</body>
</html>
