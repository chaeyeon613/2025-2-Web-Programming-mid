<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 글쓰기</title>
    <link rel="stylesheet" href="../13_NeulIt_style.css">
    <link rel="stylesheet" href="13_NeulIt_Community.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="../Lecture/13_NeulIt_LectureMain.html"><img src="../Images/main_logoicon.png" alt="로고" class="logo"></a>
            <div class="menu">
                <input type="radio" id="lecture" name="nav" value="lecture">
                <label for="lecture"><a href="../Lecture/13_NeulIt_LectureMain.html">강의</a></label>
                <input type="radio" id="mentoring" name="nav" value="mentoring">
                <label for="mentoring"><a href="../Mentoring/13_NeulIt_MentoringMain.html">멘토링</a></label>
                <input type="radio" id="community" name="nav" value="community" checked>
                <label for="community"><a href="../Community/13_NeulIt_CommunityMain.html">커뮤니티</a></label>
                <input type="radio" id="clip" name="nav" value="clip">
                <label for="clip"><a href="../Clip/13_NeulIt_ClipMain.html">클립</a></label>
            </div>
            <div>
                <a href="../Basket/13_NeulIt_Basket.html"><img src="../Images/cart.svg" alt="장바구니" class="icon"></a>
                <a href="../Profile/13_NeulIt_ProfileDash.html"><img src="../Images/profile.svg" alt="마이페이지" class="icon"></a>            
            </div>
        </nav>
    </header>

    <main class="write-main">
        <h1>새 질문 작성</h1>
        <form id="writeForm" class="write-form">
            <input type="text" id="title" placeholder="제목을 입력해 주세요." required>
            <textarea id="content" placeholder="질문 내용을 자세하게 작성해 주세요." required></textarea>
            <input type="text" id="tags" placeholder="#태그를 쉼표(,)로 구분하여 입력해 주세요. 예: react, next.js, 설치오류">
            
            <div class="write-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='13_NeulIt_CommunityMain.html'">취소</button>
                <button type="submit" class="submit-btn">글 등록</button>
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="fooer-top">
                <img src="../Images/footer_logo.PNG" alt="Inflearn 로고" class="footer-logo">
            </div>
            <div class="footer-info">
                <p>(주)늘잇 | 숙명여자대학교 2025학년도 2학기 웹프로그래밍 13팀 중간과제</p>
                <p>2415028 김수빈 | 2413954 김영채 | 2414801 김하영 | 2411041 이채연 | 2110359 여수민</p>
                <p class="footer-copy">© NEULIT. ALL RIGHTS RESERVED</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('writeForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. 폼 데이터 가져오기
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const tagsInput = document.getElementById('tags').value.trim();
            
            // 강의 선택 기능은 미사용하므로 빈 값으로 처리합니다.
            const selectedLecture = ""; 

            // 태그 배열로 변환
            const tagsArray = tagsInput ? tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag.length > 0) : [];

            // 3. 기존 게시글 목록 불러오기
            let posts = JSON.parse(localStorage.getItem('communityPosts')) || [];
            const newId = posts.length > 0 ? posts[0].id + 1 : 1; 

            // 2. 새로운 게시글 객체 생성
            const newPost = {
                id: newId, // ⭐️ 새로 생성된 ID 할당
                title: title,
                content: content,
                author: localStorage.getItem('loggedInUser') || 'Guest', // 로그인된 사용자 이름 사용
                time: new Date().toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }),
                views: 0,
                likes: 0,
                comments: 0,
                status: '미해결', // 초기 상태는 미해결
                tags: tagsArray,
                lecture: selectedLecture
            };

            // 4. 새로운 게시글 추가 (최신순을 위해 배열 맨 앞에 추가)
            posts.unshift(newPost);
            
            // 5. 로컬 스토리지에 저장
            localStorage.setItem('communityPosts', JSON.stringify(posts));

            alert('✅ 게시글이 성공적으로 등록되었습니다!');
            
            // 6. 메인 페이지로 이동
            window.location.href = '13_NeulIt_CommunityMain.html';
        });
    </script>
</body>
</html>
