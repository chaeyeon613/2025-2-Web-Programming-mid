<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수강바구니</title>
  <link rel="stylesheet" href="basket.css">
</head>
<body>


  <!-- 헤더 -->
  <header class="navbar">
    <div class="nav-left">
      <a href="#">
        <img src="/main_logoicon.png" alt="로고" class="logo">    <!-- 경로 수정 -->
      </a>
    </div>

    <nav>
      <ul class="nav-center">
        <li><a href="#">강의</a></li>
        <li><a href="#">클립</a></li>
        <li><a href="#">멘토링</a></li>
        <li><a href="#">커뮤니티</a></li>
      </ul>
    </nav>

    <div class="nav-right">
      <a href="#">
        <img src="/basketpage_icon.svg" alt="수강바구니 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
      <a href="lec_profile.html">
        <img src="/profilepage_icon.svg" alt="프로필 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
    </div>
  </header>

  <!-- 메인 -->
  <main class="container">
    <h1 class="title">수강바구니</h1>

    <!-- 전체선택 / 선택삭제 -->
    <section class="cart-top">
      <div class="select-left">
        <input type="checkbox" id="selectAll">
        <label for="selectAll">전체선택 <span class="highlight">0 / 3</span></label>
      </div>
      <button class="delete-selected">선택삭제</button>
    </section>

    <!-- 강의 항목 -->
    <article class="cart-box">
      <input type="checkbox">
      <img src="/lec_thumb3.png" alt="강의 썸네일" class="thumb">
      <div class="info">
        <p class="name">스프링 핵심 원리 - 기본편</p>
        <p class="detail">김영한 | <span class="highlight">무제한 수강</span></p>
      </div>
      <button class="remove">×</button>
      <p class="price">₩88,000</p>
    </article>

    <article class="cart-box">
      <input type="checkbox">
      <img src="/lec_thumb4.png" alt="강의 썸네일" class="thumb">
      <div class="info">
        <p class="name">독하게 시작하는 C 프로그래밍</p>
        <p class="detail">널널한 개발자 | <span class="highlight">무제한 수강</span></p>
      </div>
      <button class="remove">×</button>
      <p class="price">₩99,000</p>
    </article>

    <article class="cart-box">
      <input type="checkbox">
      <img src="/lec_thumb5.png" alt="강의 썸네일" class="thumb">
      <div class="info">
        <p class="name">한 입 크기로 잘라 먹는 리액트(React.js) : 기초부터 실전까지</p>
        <p class="detail">이정한 Winterlood | <span class="highlight">무제한 수강</span></p>
      </div>
      <button class="remove">×</button>
      <p class="price">₩48,400</p>
    </article>

  </main>

  <!-- 결제바 -->
  <section class="checkout-wrap">
    <div class="checkout-bar">
      <p class="checkout-text">
        회원 본인은 주문내역을 확인했으며, <span>구매조건</span> 및 
        <span>개인정보처리방침</span>과 결제에 동의합니다.
      </p>
      <button class="pay-btn">₩235,400 결제하기</button>
    </div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <p>footer</p>
  </footer>

</body>
</html>
