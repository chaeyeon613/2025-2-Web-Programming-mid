  <!-- 메인-->
  <div class="profile-container">
    <!-- 메뉴 -->
    <aside class="profile-aside">
      <div class="profile-info">
        <img src="../Images/me.png" alt="프로필 이미지" class="profile-img">        
        <h2 class="profile-id">neulit</h2>
        <p class="profile-email">neulit@gmail.com</p>
        <button class="edit-btn">프로필 수정</button>
      </div>

      <div class="profile-menu">
        <a href="13_NeulIt_ProfileDash.html" class="menu-item">대시보드</a>

    <main class="profile-main">
      <h1 class="main-title">내 학습</h1>

      <!-- 상단 탭 -->
      <div class="profile-tabs">
        <button class="tab-btn active">강의</button>
        <button class="tab-btn">폴더</button>
        <button class="tab-btn">수료증</button>
      </div>
    
      <div class="lecture-top">
        <!-- 상태 버튼 -->
        <div class="profile-status">
          <button class="status-btn active">학습중</button>
          <button class="status-btn">완강</button>
        </div>

        <!-- 정렬 -->
        <div class="lecture-dropdown">
          <select id="sortSelect">
            <option value="latest">최신순</option>
            <option value="rate">학습률순</option>
          </select>
        </div>
      </div>
      
      <!-- 강의 목록 -->
      <section class="lecture-list"></section>

    </main>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-container">
