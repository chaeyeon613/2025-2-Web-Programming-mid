<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 객체로 사용자 정보 보관 및 변경 사항 로그 출력하기</title>
</head>
<body>
    <script>
        //객체 생성자 함수 기본 형태
        function userService() {

            //사용자 데이터베이스
            this.userDatabase = [];

            //현재 시간을 확인하는 메소드
            this.getCurrentTime = function() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hour = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const sec = String(now.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hour}:${min}:${sec}`;
            };
            
            //사용자를 추가하는 메소드
            this.addUser = function(name, email) {
                this.userDatabase.push({ name: name, email: email });
                console.log(`${this.getCurrentTime()} ${name} 유저 가입`);
            };

            //사용자 이름을 변경하는 메소드
            this.modifyUser = function(oldName, newName) {
                let user = this.userDatabase.find(u => u.name === oldName);
                if (user) {
                    user.name = newName;
                    console.log(`${this.getCurrentTime()} ${oldName} 유저 ${newName}로 이름 변경`);
                } else {
                    console.log(`${this.getCurrentTime()} ${oldName} 사용자를 찾을 수 없습니다`);
                }
            };

            //전체 사용자 목록을 확인할 수 있는 메소드
            this.checkAllUser = function() {
                if (this.userDatabase.length === 0) {
                    console.log(`${this.getCurrentTime()} DB 조회 결과 가입한 사용자가 없습니다`);
                } else {
                    const names = this.userDatabase.map(u => u.name).join(", ");
                    console.log(`${this.getCurrentTime()} DB 조회 결과 ${names} 사용자가 존재합니다`);
                }
            };
        }

        const service = new userService();
    </script>
</body>
</html>
