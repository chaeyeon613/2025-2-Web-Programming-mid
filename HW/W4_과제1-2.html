<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도로명 주소 검색 페이지</title>
</head>
<body>
    <p><strong>검색방법</strong></p>
    <p>지역 선택 후 도로명 또는 건물번호를 입력하세요. <br>
    예) 지역선택: 서울특별시 용산구/ 도로명: 청파로47길 100</p>
    <form action="#" method="get">
        <label for="region"><strong>지역검색</strong></label>
        <select name="region" size="1" id="region" style="width: 300px;">
            <option value="" disabled selected hidden>--지역--</option>
            <option value="Seoul">서울</option>
            <option value="Busan">부산</option>
            <option value="Incheon">인천</option>
            <option value="Daegu">대구</option>
            <option value="Gwangju">광주</option>
            <option value="Jeju">제주</option>
        </select>
        <br>
        <label for="add2"><strong>도로명</strong></label>
        <input type="text" name="input" value="예) 청파로47길 100" style="width: 300px;" id="add2">
        <button type="button"><span>검색</span></button>
    </form>
</body>
</html>
