<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><a> 문서 내 특정 위치로 이동하기</a></title>
</head>
<body>
    <ol>
        <li>열대 과일: <a href="#fruit01">제주 애플 망고</a></li>
        <li>핵과류: <a href="#fruit02">경산 천도복숭아</a></li>
        <li>박과류: 부여 메론</li>
    </ol>

    <div style="width:500px; height: 1200px;"></div>

    <h3>과일 목록</h3>
    <ol>
        <li>
            <a id="fruit01"></a>
            <h5>애플 망고</h5>
            <table border="1">
                <tr>
                    <td>
                        <ul>
                            <li>원산지: 제주도</li>
                            <li>농장: 놀멍쉬멍걸으멍</li>
                            <li>특징: 항공직송 제주산 애플망고 대과...</li>
                        </ul>
                    </td>
                </tr>
            </table>
            <div style="width:500px; height:1200px"></div>
        </li>
        <li>
            <a id="fruit02"></a>
            <h5>천도복숭아</h5>
            <table border="1">
                <tr>
                    <td>
                        <ul>
                            <li>원산지: 경상북도 경산 </li>
                            <li>농장: 경산프레쉬과수원</li>
                            <li>특징: 당일배송 13 브릭스 고당도...</li>
                        </ul>
                    </td>
                </tr>
            </table>
        <div style="width: 500px; height:1200px;"></div>
        </li>
    </ol>
</body>
</html>
