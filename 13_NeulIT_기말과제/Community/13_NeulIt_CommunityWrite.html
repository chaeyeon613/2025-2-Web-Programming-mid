    <main class="write-main">
        <h1>새 질문 작성</h1>
        <form id="writeForm" class="write-form">
            <input type="text" id="title" placeholder="제목을 입력해 주세요." required>
            <textarea id="content" placeholder="질문 내용을 자세하게 작성해 주세요." required></textarea>
            <input type="text" id="tags" placeholder="#태그를 쉼표(,)로 구분하여 입력해 주세요. 예: react, next.js, 설치오류">
            
            <div class="write-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='13_NeulIt_CommunityMain.html'">취소</button>
                <button type="submit" class="submit-btn">글 등록</button>
            </div>
        </form>
    </main>
