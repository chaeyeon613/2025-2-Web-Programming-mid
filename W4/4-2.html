<head>

        <input type="checkbox" name="hobby" value="movie" id="check2" disabled>
        <label for="check2">영화</label>
        <input type="checkbox" name="hobby" value="drawing" id="check3" disabled>
        <label for="check3">그림</label>
    </fieldset>
