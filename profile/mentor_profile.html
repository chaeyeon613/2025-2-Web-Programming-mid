<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 | 멘토링</title>
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <!-- 헤더 -->
  <header class="navbar">
    <div class="nav-left">
      <a href="#">
        <img src="/main_logoicon.png" alt="로고" class="logo">    <!-- 경로 수정 -->
      </a>
    </div>

    <nav>
      <ul class="nav-center">
        <li><a href="#">강의</a></li>
        <li><a href="#">클립</a></li>
        <li><a href="#">멘토링</a></li>
        <li><a href="#">커뮤니티</a></li>
      </ul>
    </nav>

    <div class="nav-right">
      <a href="#">
        <img src="/basketpage_icon.svg" alt="수강바구니 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
      <a href="dash_profile.html">
        <img src="/profilepage_icon.svg" alt="프로필 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <div class="profile-container">
    
    <!-- 왼쪽 메뉴 -->
    <aside class="profile-aside">
      <div class="profile-info">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="프로필 이미지" class="profile-img">
        <h2 class="profile-id">neulit</h2>
        <p class="profile-email">neulit@gmail.com</p>
        <button class="edit-btn">프로필 수정</button>
      </div>

      <div class="profile-menu">
        <a href="dash_profile.html" class="menu-item ">대시보드</a>
        <a href="lec_profile.html" class="menu-item">내 학습</a>
        <a href="mentor_profile.html" class="menu-item active">멘토링</a>
        <a href="com_profile.html" class="menu-item">커뮤니티 게시글</a>
      </div>
    </aside>

    <!-- 오른쪽 메인 -->
    <main class="profile-main">
      <h1 class="main-title">멘토링</h1>

            <!-- 바 -->
            <div class="study-status">
              <button class="status-btn active">전체</button>
              <button class="status-btn">예약 확정</button>
              <button class="status-btn">이용 완료</button>
            </div>

            <section class="mentoring-list">
              <div class="mentoring-card">
                <img src="/mentor1.png" alt="멘토링 썸네일" class="mentor-img">
                <div class="mentoring-info">
                  <h3 class="mentor-name">Lucy</h3>
                  <p class="mentor-category">[개발 / 프로그래밍]</p>
                  <p class="mentor-detail">서버 개발자 고민 상담소</p>
                  <p class="mentoring-date">2025.10.20 (월) 오후 3:00</p>
                  <span class="mentoring-status confirmed">예약 확정</span>
                </div>
              </div>

              <div class="mentoring-card">
                <img src="/mentor2.png" alt="멘토링 썸네일" class="mentor-img">
                <div class="mentoring-info">
                  <h3 class="mentor-name">G - Sam</h3>
                  <p class="mentor-category">[커리어 / 자기계발]</p>
                  <p class="mentor-detail">이력서 & 포트폴리오 피드백</p>
                  <p class="mentoring-date">2025.09.18 (수) 오후 1:00</p>
                  <span class="mentoring-status done">이용 완료</span>
                </div>
              </div>
            </section>
            
    </main>
    
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <p>footer</p>
  </footer>

</body>
</html>
