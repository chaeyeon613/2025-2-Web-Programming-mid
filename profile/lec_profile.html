<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 | 내 학습</title>
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <!-- 헤더 -->
  <header class="navbar">
    <div class="nav-left">
      <a href="#">
        <img src="/main_logoicon.png" alt="로고" class="logo">    <!-- 경로 수정 -->
      </a>
    </div>

    <nav>
      <ul class="nav-center">
        <li><a href="#">강의</a></li>
        <li><a href="#">클립</a></li>
        <li><a href="#">멘토링</a></li>
        <li><a href="#">커뮤니티</a></li>
      </ul>
    </nav>

    <div class="nav-right">
      <a href="#">
        <img src="/basketpage_icon.svg" alt="수강바구니 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
      <a href="dash_profile.html">
        <img src="/profilepage_icon.svg" alt="프로필 페이지 이동" class="icon-img">    <!-- 경로 수정 -->
      </a>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <div class="profile-container">
    
    <!-- 왼쪽 메뉴 -->
    <aside class="profile-aside">
      <div class="profile-info">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="프로필 이미지" class="profile-img">        <h2 class="profile-id">neulit</h2>
        <p class="profile-email">neulit@gmail.com</p>
        <button class="edit-btn">프로필 수정</button>
      </div>

      <div class="profile-menu">
        <a href="dash_profile.html" class="menu-item ">대시보드</a>
        <a href="lec_profile.html" class="menu-item active">내 학습</a>
        <a href="mentor_profile.html" class="menu-item">멘토링</a>
        <a href="com_profile.html" class="menu-item">커뮤니티 게시글</a>
      </div>
    </aside>

    <!-- 오른쪽 메인 -->
    <main class="profile-main">
      <h1 class="main-title">내 학습</h1>

      <!-- 바 -->
      <div class="study-tabs">
        <button class="tab-btn active">강의</button>
        <button class="tab-btn">폴더</button>
        <button class="tab-btn">수강확인증</button>
        <button class="tab-btn">클립</button>
      </div>
    
      <div class="study-status">
        <button class="status-btn active">학습중</button>
        <button class="status-btn">완강</button>
      </div>

      <!-- 수강 강의 목록 -->
      <section class="lecture-list">
        <div class="lecture-card">
          <img src="#" alt="강의 썸네일" class="lecture-thumb">
          <div class="lecture-info">
            <h3 class="lecture-title">웹프로그래밍</h3>
            <p class="lecture-author"> 김수빈 | 무제한 수강</p>
            <div class="lecture-progress">
              <div class="progress-bar" style="width: 35%;"></div>
            </div>
            <p class="lecture-status">28 / 82강 (35%)</p>
          </div>
        </div>
      
        <div class="lecture-card">
          <img src="#" alt="강의 썸네일" class="lecture-thumb">
          <div class="lecture-info">
            <h3 class="lecture-title">데이터베이스</h3>
            <p class="lecture-author">김수빈 | 남은 기간: 54일</p>
            <div class="lecture-progress">
              <div class="progress-bar" style="width: 70%;"></div>
            </div>
            <p class="lecture-status">21 / 30강 (70%)</p>
          </div>
        </div>
      </section>
      
    </main>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <p>footer</p>
  </footer>

</body>
</html>
