<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클립 목록</title>
  <link rel="stylesheet" href="Clip.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <img src="logo.png" alt="로고" class="logo">
            <ul class="menu">
                <li><a href="#">강의</a></li>
                <li><a href="#">멘토링</a></li>
                <li><a href="#">커뮤니티</a></li>
                <li><a href="#">클립</a></li>
            </ul>
            <div>
                <a href="#"><img src="cart.png" alt="장바구니" class="icon"></a>
                <a href="#"><img src="profile.png" alt="마이페이지" class="icon"></a>            
            </div>
        </nav>
    </header>
    
    
    <main class="clip-container">

    <!-- 검색 및 정렬 -->
    <div class="search-sort-bar">
      <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요">
        <button>검색</button>
      </div>

      <div class="sort-box">
        <label for="sort">정렬:</label>
        <select id="sort">
          <option value="recent">최신순</option>
          <option value="popular">인기순</option>
          <option value="recommend">추천순</option>
        </select>
      </div>
    </div>

    <!-- 클립 목록 -->
    <section class="clip-list">
      <article class="clip-item">
        <div class="clip-thumb"></div>
        <div class="clip-info">
          <h3>짧은 파이썬 강의</h3>
          <p>3분만에 핵심 문법 복습</p>
          <p>조회수 1.2만회 · 좋아요 320</p>
        </div>
      </article>

      <article class="clip-item">
        <div class="clip-thumb"></div>
        <div class="clip-info">
          <h3>HTML 태그 한눈에 보기</h3>
          <p>태그 구조 & 기본 문법 정리</p>
          <p>조회수 9800 · 좋아요 290</p>
        </div>
      </article>

      <article class="clip-item">
        <div class="clip-thumb"></div>
        <div class="clip-info">
          <h3>SQL JOIN 쉽게 이해하기</h3>
          <p>INNER, LEFT, RIGHT 차이 한방 정리</p>
          <p>조회수 7200 · 좋아요 260</p>
        </div>
      </article>
    </section>

    <!-- 관련 뉴스 -->
    <section class="related-news">
      <h4>[관련 뉴스]</h4>
      <ul>
        <li><a href="#">IT 트렌드: 단기 클립 학습의 성장</a></li>
      </ul>
    </section>

  </main>

  <!--푸터 -->
   <footer class="footer">
        <p>footer</p>
    </footer>
</body>
</html>
