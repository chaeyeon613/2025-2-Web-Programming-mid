<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 상세</title>
    <link rel="stylesheet" href="LectureStyle.css">
</head>
<body>
    <!-- 공통 메뉴바 -->
    <nav>
        <ul class="nav-container">
            <li class="nav-detail__item"><a href="#">강의</a></li>
            <li class="nav-detail__item"><a href="#">멘토링</a></li>
            <li class="nav-detail__item"><a href="#">커뮤니티</a></li>
            <li class="nav-detail__item"><a href="#">클립</a></li>
        </ul>
    </nav>

    <!-- 상세 헤더 -->
    <header class="detail-header">
        <div class="detail-header__content">
            <!-- 왼쪽 텍스트 -->
            <div class="detail-header__info">
                <h1 class="detail-header__title">한 입 크기로 잘라 먹는 리액트(React.js): 기초부터 실전까지</h1>
                <p class="detail-header__desc">
                        개념부터 독특한 프로젝트까지 함께 다뤄보며 자바스크립트와 리액트를 이 강의로 한 번에 끝내요.<br>
                        학습은 짧게, 응용은 길게 All-in-one 강의!
                </p>
                <div class="detail-header__tags">
                    <p class="tags">#개발 프로그래밍  #프론트엔드</p>
                    <p class="person">⭐⭐⭐⭐⭐ 4.9 수강생 13,100명</p>
                </div>
            </div>
            <!-- 오른쪽 강의 관련 유튜브 -->
            <div class="detail-header__video">
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/3Jn9ELD9jqg?si=0Rp3O30E26zuxMxX"
                title="React 강의 소개 영상"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
            </div>
        </div>
    </header>

    <main class="detail-main">
        <!-- 강의 소개, 커리큘럼 수강평 인덱스 메뉴 -->
        <aside>
            <div class="detail-main__sidebar">
                <h3>목차</h3>
                <ul>
                    <li><a href="#intro">강의 소개</a></li>
                    <li><a href="#curriculum">커리큘럼</a></li>
                    <li><a href="#review">수강평</a></li>
                </ul>
            </div>
        </aside>
        <!-- 강의 상세 내용 본문 -->
        <article class="detail-main__content">
            <div id="intro">
                강의 소개
            </div>
            <div id="curriculum">
                커리큘럼
            </div>
            <div id="review">
                수강평
            </div>
        </article>

        <!-- 가격, 수강신청 버튼, 장바구니 버튼 -->
        <aside class="detail-main__buy">
            가격
        </aside>
    </main>
</body>
</html>
