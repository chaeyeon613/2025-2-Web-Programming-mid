<!DOCTYPE html>

<body>
    <h2>다양한 텍스트 표현</h2>
    <p>텍스트의 성격을 지정해 주는 em요소로
    <em>강조(em)</em>, <strong>강한 강조</strong>
    <mark>하이라이트</mark>, <small>작은 글자</small>
    <sub>아래첨자</sub>, <sup>위첨자</sup>를 표현할 수 있다.
    </p>
</body>

<body>
    <p>순서 없는 목록</p>
    <ul>
        <li>첫번쨰 항목</li>
        <li>두 번째 항목</li>
        <li>세 번째 항목</li>
    </ul>
</body>

<body>
    <p>순서 있는 목록</p>
    <ol>
        <li>첫 번째 항목
        </li>
        <li>두번째 항목</li>
    </ol>
</body>
