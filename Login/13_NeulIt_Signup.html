<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="../13_NeulIt_style.css">
    <link rel="stylesheet" href="13_NeulIt_Login.css"> 
</head>
<body class="login-page">

    <div class="banner">
        <div class="banner-content">
            <h1 class="banner-message">반가워요, 여성 개발자들의 성장을 돕는 NeulIT 입니다!</h1>
            <div style="width: 45px; height: 1px;"></div> 
        </div>
    </div>

    <main class="login-main">
        <div class="login-box">
            <div class="login-logo">
                <img src="../Images/footer_logo.png" alt="NeulIt 로고" class="main-logo"> 
            </div>

            <p class="signup-prompt">이미 회원이신가요? <a href="13_NeulIt_Login.html" class="signup-link">로그인 하기</a></p>
            
            <form id="signupForm" class="login-form">
                <div class="input-field">
                    <input type="text" id="signup_id" placeholder="아이디 (이메일)" required>
                </div>
                <div class="input-field">
                    <input type="text" id="signup_name" placeholder="이름" required>
                </div>
                <div class="input-field">
                    <input type="password" id="signup_pw" placeholder="비밀번호" required>
                </div>
                <div class="input-field">
                    <input type="password" id="signup_pw_confirm" placeholder="비밀번호 확인" required>
                </div>
                
                <button type="submit" class="login-button">회원가입 완료</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="fooer-top">
                <img src="../Images/footer_logo.PNG" alt="Inflearn 로고" class="footer-logo">
            </div>
            <div class="footer-info">
                <p>(주)늘잇 | 숙명여자대학교 2025학년도 2학기 웹프로그래밍 13팀 중간과제</p>
                <p>2415028 김수빈 | 2413954 김영채 | 2414801 김하영 | 2411041 이채연 | 2110359 여수민</p>
                <p class="footer-copy">© NEULIT. ALL RIGHTS RESERVED</p>
            </div>
        </div>
    </footer>
    
    <script src="13_NeulIt_Signup.js"></script>

    </body>
</html>
