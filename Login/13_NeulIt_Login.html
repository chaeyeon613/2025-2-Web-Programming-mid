<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="../13_NeulIt_style.css">
    <link rel="stylesheet" href="13_NeulIt_Login.css"> 
</head>
<body class="login-page">
    <div id="fullScreenContent">    
        <div class="banner">
            <div class="banner-content">
                <h1 class="banner-message">반가워요, 여성 개발자들의 성장을 돕는 NeulIT 입니다!</h1>
            </div>
        </div>

        <main class="login-main">
            <div class="login-box">
                <div class="login-logo">
                    <img src="../Images/footer_logo.png" alt="NeulIt 로고" class="main-logo"> 
                </div>

                <p class="signup-prompt">회원이 아니신가요? <a href="13_NeulIt_Signup.html" class="signup-link">회원가입 하기</a></p>

                <form id="loginForm" class="login-form">
                    <div class="input-field">
                        <input type="text" id="login_id" placeholder="이메일 또는 아이디" required>
                    </div>
                    <div class="input-field">
                        <input type="password" id="login_pw" placeholder="비밀번호" required>
                    </div>
                    <button type="submit" class="login-button">로그인 하기</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="fooer-top">
                <img src="../Images/footer_logo.PNG" alt="Inflearn 로고" class="footer-logo">
            </div>
            <div class="footer-info">
                <p>(주)늘잇 | 숙명여자대학교 2025학년도 2학기 웹프로그래밍 13팀 중간과제</p>
                <p>2415028 김수빈 | 2413954 김영채 | 2414801 김하영 | 2411041 이채연 | 2110359 여수민</p>
                <p class="footer-copy">© NEULIT. ALL RIGHTS RESERVED</p>
            </div>
        </div>
    </footer>

    <script src="13_NeulIt_Login.js"></script>
    
    </body>
</html>
