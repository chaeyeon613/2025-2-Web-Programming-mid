<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 선택자 종류</title>
    <style type="text/css">
        p {font-size: 10pt;}
        .under1 {text-decoration: underline; font-style: italic;}
        strong.under1 {font-size: 12pt;}
        #next {text-decoration: underline; text-align: center;}

    </style>
</head>
<body>
    <h3 class="under1">스타일 시트 이해하기</h3>
    <p>이 예제는 <strong class="under1">CSS</strong>의 개념을 설명합니다.</p>
    <br><span class="under1">클래스</span>와 ID로 스타일을 지정합니다.
    <p id="next">다음 예제로 이어집니다.</p>
</body>
</html>
