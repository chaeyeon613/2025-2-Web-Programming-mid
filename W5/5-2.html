<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div, span</title>
</head>
<body>
    <div style="font-style: italic;">
        <h3>스타일 시트 이해하기</h3>
        <p>이 예제는 <span style="font-weight: bold; text-decoration: underline;">CSS</span>의 개념을 설명합니다.</p>
    </div>
    <p>다음 예제로 이어집니다.</p>
</body>
</html>
