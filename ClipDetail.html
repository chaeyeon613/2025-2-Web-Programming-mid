<body>

  <!-- 헤더 -->
  <header>

      <img src="logo.png" alt="로고" class="logo" width="120">

  <!-- 메인 -->
  <main>
    <section class="lecture-section">

        <h2>강의 설명</h2>
        <p>이 강의에서는 React를 사용하여 프론트엔드 웹 애플리케이션을 만드는 방법을 다룹니다.</p>
        <p>컴포넌트 구조, 상태 관리, 라우팅 등의 핵심 개념을 자세히 설명합니다.</p>
        <p>실습 예제와 함께 프로젝트를 직접 만들어보며 실무 감각을 익힙니다.</p>
        <p>웹 개발 입문자부터 중급자까지 모두를 위한 강의입니다.</p>
      </div>
    </section>

    <aside class="recommend-section">
      <h3>비슷한 강의 추천</h3>

      <div class="recommend-card">
        <iframe src="https://www.youtube.com/embed/Ke90Tje7VS0" title="Next.js 입문 강의" allowfullscreen></iframe>
        <div class="recommend-title">Next.js 입문 강의</div>

      <div class="recommend-card">
